<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clingy — focus timer</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!--
      How to open this app:
      Do not double-click the file. The browser blocks JavaScript modules
      on file:// pages. In a terminal, from this folder, run:

        node serve.mjs

      Then visit http://localhost:5173
    -->
  </head>
  <body>
    <main class="widget">
      <h1 class="brand">Clingy</h1>
      <p class="tagline">Name one small task. Then stay with it.</p>

      <div class="row" role="group" aria-label="Session type">
        <button type="button" data-session="focus" aria-pressed="true">Focus</button>
        <button type="button" data-session="shortBreak" aria-pressed="false">Short break</button>
        <button type="button" data-session="longBreak" aria-pressed="false">Long break</button>
      </div>

      <div class="row" role="group" aria-label="Timing mode">
        <button type="button" data-timing="countdown" aria-pressed="true">Countdown</button>
        <button type="button" data-timing="stopwatch" aria-pressed="false">Stopwatch</button>
      </div>

      <div class="task">
        <label for="task-label">Micro-task</label>
        <input
          id="task-label"
          type="text"
          maxlength="120"
          placeholder="What is small enough to finish in this session?"
          autocomplete="off"
        />
        <p class="hint">Small enough to finish in this session.</p>
        <p class="error" id="error" aria-live="polite"></p>
      </div>

      <p class="clock" id="clock">25:00</p>
      <p class="status" id="status">Idle · 0 of 4 focuses until a long break</p>

      <div class="row controls">
        <button type="button" id="btn-start">Start</button>
        <button type="button" id="btn-pause">Pause</button>
        <button type="button" id="btn-skip">Skip</button>
        <button type="button" id="btn-reset">Reset</button>
      </div>

      <section class="durations">
        <h2>Durations (minutes)</h2>
        <div class="fields">
          <label>
            Focus
            <input id="dur-focus" type="number" min="1" step="1" value="25" />
          </label>
          <label>
            Short
            <input id="dur-short" type="number" min="1" step="1" value="5" />
          </label>
          <label>
            Long
            <input id="dur-long" type="number" min="1" step="1" value="15" />
          </label>
        </div>
      </section>

      <p class="serve-note">
        Open via a local server, not as a file:
        <code>node serve.mjs</code>
        then <code>http://localhost:5173</code>
      </p>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
